<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISMA ABYSS - Job Data Editor</title>
<script src="skills.js"></script>
<script src="job_data.js"></script>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--panel2:#18233c;--line:#2b3854;--muted:#9aa7bd;--text:#eef4ff;--accent:#f2b84b;--accent2:#61d3ff;--ok:#43d18a;--danger:#ff6b80;--input:#0d1528}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0d1425}.brand strong{color:var(--accent);font-size:18px}.brand span{color:var(--muted);font-size:12px;margin-left:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:9px;font-weight:800}.btn.primary{background:#255ec8;border-color:#397bff}.btn.green{background:#12683f;border-color:#23a96b}.btn.danger{background:#76273a;border-color:#b94d65}.layout{min-height:0;display:grid;grid-template-columns:280px 1fr}.side{min-height:0;border-right:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;background:#0e1527}.sidehead{padding:12px;border-bottom:1px solid var(--line)}input,select,textarea{width:100%;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.joblist{overflow:auto;padding:8px}.jobrow{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);margin-bottom:5px;text-align:left}.jobrow:hover{background:rgba(255,255,255,.05)}.jobrow.active{border-color:var(--accent);background:rgba(242,184,75,.1)}.jobrow small{color:var(--muted)}.main{min-width:0;min-height:0;overflow:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.hero h1{margin:0 0 5px;font-size:24px}.hero .meta{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.toolbar input[type=checkbox]{width:auto}.tablewrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:#151f35;color:var(--muted);font-size:11px;text-align:left;padding:9px;border-bottom:1px solid var(--line);z-index:2}td{padding:7px 9px;border-bottom:1px solid rgba(43,56,84,.55);vertical-align:top}.lv{width:68px;color:var(--accent);font-weight:900}.skillcell select{min-width:500px}.detail{color:var(--muted);font-size:11px;line-height:1.5;margin-top:5px}.assigned{color:var(--ok);font-weight:800}.empty{color:#647087}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:30px;z-index:50}.modal.open{display:flex}.dialog{width:min(1100px,96vw);height:min(82vh,850px);background:#0d1425;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.dialog textarea{height:100%;resize:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre}.dialoghead{display:flex;justify-content:space-between;align-items:center}.dialoghead h2{margin:0;font-size:16px}.status{font-size:12px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:220px 1fr}.skillcell select{min-width:320px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><strong>JOB DATA EDITOR</strong><span>editor_job_data.html</span></div><div class="actions"><button class="btn" id="previewBtn">JSプレビュー</button><button class="btn green" id="downloadBtn">job_data.js 出力</button><button class="btn danger" id="resetBtn">全変更をリセット</button></div></header>
<div class="layout">
<aside class="side"><div class="sidehead"><input id="jobSearch" placeholder="職業名 / IDで検索"></div><div id="jobList" class="joblist"></div></aside>
<main class="main"><div id="editor"></div></main>
</div></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2>job_data.js プレビュー</h2><button class="btn" id="closeModal">閉じる</button></div><textarea id="exportText" spellcheck="false"></textarea><div class="toolbar"><button class="btn primary" id="copyBtn">コピー</button><span class="status" id="status"></span></div></div></div>
<script>
(()=>{'use strict';
const clone=v=>JSON.parse(JSON.stringify(v));
const jobs=()=>Array.isArray(window.JOB_MASTER_DATA)?window.JOB_MASTER_DATA:[];
const initialJobs=clone(jobs());
const initialSkills=clone(window.JOB_SKILLS_DATA||{});
const state={jobs:clone(initialJobs),jobSkills:clone(initialSkills),skills:clone(Array.isArray(window.SKILLS_DATA)?window.SKILLS_DATA:[]).sort((a,b)=>Number(a.id)-Number(b.id)),selectedId:null,query:'',assignedOnly:false};
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const skillById=id=>state.skills.find(s=>Number(s.id)===Number(id))||null;
const skillLabel=s=>{if(!s)return '未設定';const meta=[s.type,s.target,Number(s.mp)>0?`MP${s.mp}`:'MP0'].filter(Boolean).join('/');return `ID ${String(s.id).padStart(3,'0')}｜${s.name||'名称なし'}｜${meta}｜${s.desc||'効果説明なし'}`};
const selectedJob=()=>state.jobs.find(j=>Number(j.id)===Number(state.selectedId))||state.jobs[0]||null;
function ensureSelection(){if(!selectedJob()&&state.jobs.length)state.selectedId=state.jobs[0].id;if(state.selectedId==null&&state.jobs.length)state.selectedId=state.jobs[0].id;}
function renderJobs(){ensureSelection();const q=state.query.trim().toLowerCase();$('jobList').innerHTML=state.jobs.filter(j=>!q||String(j.id).includes(q)||String(j.name).toLowerCase().includes(q)).map(j=>`<button class="jobrow ${Number(j.id)===Number(state.selectedId)?'active':''}" data-id="${j.id}"><span>${esc(j.name)}</span><small>ID ${j.id}</small></button>`).join('');$('jobList').querySelectorAll('.jobrow').forEach(b=>b.onclick=()=>{state.selectedId=Number(b.dataset.id);renderJobs();renderEditor()})}
function optionHtml(current){let out=`<option value="">— 未設定 —</option>`;for(const s of state.skills)out+=`<option value="${s.id}" ${Number(current)===Number(s.id)?'selected':''}>${esc(skillLabel(s))}</option>`;return out}
function renderEditor(){const job=selectedJob();if(!job){$('editor').innerHTML='<div class="empty">職業データがありません。</div>';return}const table=state.jobSkills[job.name]||(state.jobSkills[job.name]={});let rows='';for(let lv=1;lv<=100;lv++){const sid=table[String(lv)]??table[lv]??'';if(state.assignedOnly&&!sid)continue;const sk=skillById(sid);rows+=`<tr><td class="lv">Lv ${lv}</td><td class="skillcell"><select data-level="${lv}">${optionHtml(sid)}</select><div class="detail">${sk?`<span class="assigned">${esc(sk.name)}</span>　${esc(sk.desc||'効果説明なし')}`:'<span class="empty">このレベルでは習得なし</span>'}</div></td></tr>`}
$('editor').innerHTML=`<section class="hero"><div><h1>${esc(job.name)}</h1><div class="meta">固定 Job ID: ${job.id} ／ Lv1～100の習得スキルを編集</div></div><div class="toolbar"><label><input id="assignedOnly" type="checkbox" ${state.assignedOnly?'checked':''}> 設定済みLvのみ表示</label><button class="btn" id="clearJob">この職の習得表をクリア</button></div></section><div class="tablewrap"><table><thead><tr><th>習得Lv</th><th>スキル（ID順／名称・効果併記）</th></tr></thead><tbody>${rows}</tbody></table></div>`;
$('assignedOnly').onchange=e=>{state.assignedOnly=e.target.checked;renderEditor()};$('clearJob').onclick=()=>{if(confirm(`${job.name}の習得スキル設定をすべてクリアしますか？`)){state.jobSkills[job.name]={};renderEditor()}};
$('editor').querySelectorAll('select[data-level]').forEach(sel=>sel.onchange=()=>{const lv=String(Number(sel.dataset.level));const v=Number(sel.value);if(sel.value==='')delete state.jobSkills[job.name][lv];else state.jobSkills[job.name][lv]=v;renderEditor()});}
function cleanSkillTables(){const out={};for(const j of state.jobs){const src=state.jobSkills[j.name]||{};const entries=Object.entries(src).map(([lv,sid])=>[Number(lv),Number(sid)]).filter(([lv,sid])=>Number.isInteger(lv)&&lv>=1&&lv<=100&&skillById(sid)).sort((a,b)=>a[0]-b[0]);out[j.name]={};for(const [lv,sid] of entries)out[j.name][String(lv)]=sid}return out}
function generate(){const masters=state.jobs.map(j=>`    Object.freeze(${JSON.stringify(j)})`).join(',\n');const skillText=JSON.stringify(cleanSkillTables(),null,4);return `/* job_data.js */\n\n// 職業IDはセーブ・転職の書・将来の職業特性判定で共有する固定ID。名称変更時もIDは変更しない。\nwindow.JOB_MASTER_DATA = Object.freeze([\n${masters}\n]);\n\nwindow.JobData = Object.freeze({\n    getAll: () => window.JOB_MASTER_DATA.slice(),\n    getById: (id) => window.JOB_MASTER_DATA.find(job => Number(job.id) === Number(id)) || null,\n    getByName: (name) => {\n        const normalized = String(name || \"\");\n        return window.JOB_MASTER_DATA.find(job => job.name === normalized) || null;\n    }\n});\n\nwindow.JOB_SKILLS_DATA = ${skillText};\nwindow.JOB_SKILLS = window.JOB_SKILLS_DATA;\nwindow.refreshJobChangeBookItemMetadata?.();\n`;}
function showPreview(){const txt=generate();$('exportText').value=txt;$('modal').classList.add('open');$('status').textContent=`${state.jobs.length}職 / ${state.skills.length}スキル参照`}
function download(){const text=generate();const blob=new Blob([text],{type:'text/javascript;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='job_data.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('jobSearch').oninput=e=>{state.query=e.target.value;renderJobs()};$('previewBtn').onclick=showPreview;$('downloadBtn').onclick=download;$('closeModal').onclick=()=>$('modal').classList.remove('open');$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('exportText').value);$('status').textContent='コピーしました'};$('resetBtn').onclick=()=>{if(!confirm('編集中の変更をすべて破棄して、読み込み時のjob_data.jsへ戻しますか？'))return;state.jobs=clone(initialJobs);state.jobSkills=clone(initialSkills);state.selectedId=state.jobs[0]?.id??null;state.assignedOnly=false;renderJobs();renderEditor()};
state.selectedId=state.jobs[0]?.id??null;renderJobs();renderEditor();
})();
</script>
</body></html>
