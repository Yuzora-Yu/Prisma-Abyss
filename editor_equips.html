<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PRISMA ABYSS - Equipment Editor</title>
<script src="equips.js"></script>
<style>
:root{
  --bg:#0a0f1d;--panel:#111a2d;--panel2:#162238;--panel3:#0c1424;--line:#2a3853;
  --text:#eef4ff;--muted:#9ba9bf;--gold:#f2bd51;--cyan:#67d9ff;--green:#4ad18f;
  --red:#ff6f7f;--input:#0c1527;--shadow:0 18px 56px rgba(0,0,0,.35)
}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(61,103,255,.16),transparent 28%),var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text);padding:9px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,189,81,.13)}
button{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:800;padding:9px 12px}.btn:hover{filter:brightness(1.08)}.btn.primary{background:#275fc3;border-color:#3d7dff}.btn.green{background:#146440;border-color:#2ba76f}.btn.gold{background:#7d5418;border-color:#c88d25}.btn.red{background:#7b2636;border-color:#bd4d61}.btn.ghost{background:transparent}.btn.small{padding:6px 8px;font-size:12px}
.app{height:100%;display:grid;grid-template-rows:64px 1fr}.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(9,14,27,.94);backdrop-filter:blur(14px);z-index:10}.brand{min-width:280px}.brand strong{display:block;color:var(--gold);font-size:18px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top-stats{color:var(--muted);font-size:12px;white-space:nowrap}
.layout{min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr)}.sidebar{min-height:0;display:grid;grid-template-rows:auto 1fr auto;background:rgba(8,13,25,.78);border-right:1px solid var(--line)}.filters{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.equip-list{overflow:auto;padding:8px}.equip-row{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;padding:9px;border:1px solid transparent;border-radius:14px;background:rgba(255,255,255,.025);color:inherit;text-align:left;margin-bottom:7px}.equip-row:hover{border-color:var(--line);background:rgba(255,255,255,.055)}.equip-row.active{border-color:rgba(242,189,81,.78);background:rgba(242,189,81,.1)}
.thumb,.icon-large,.compare-icon{display:grid;place-items:center;overflow:hidden;background:repeating-conic-gradient(#1a2435 0 25%,#101928 0 50%) 50%/16px 16px;border:1px solid var(--line)}.thumb{width:64px;height:64px;border-radius:12px}.thumb img,.icon-large img,.compare-icon img{max-width:92%;max-height:92%;object-fit:contain;image-rendering:auto}.thumb-missing{color:#70809a;font-size:11px;text-align:center}.row-main{min-width:0}.row-title{display:flex;gap:7px;align-items:center}.row-title b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--gold);font-size:11px;font-weight:900}.row-meta{margin-top:5px;color:var(--muted);font-size:10px;display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:7px;padding:2px 5px}.tag.special{color:#ffc1ca;border-color:rgba(255,111,127,.5);background:rgba(255,111,127,.08)}
.side-actions{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.main{min-width:0;min-height:0;overflow:auto;padding:18px}.empty{height:100%;display:grid;place-items:center;color:var(--muted)}
.hero{display:grid;grid-template-columns:180px minmax(0,1fr) 190px;gap:18px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(103,217,255,.09),rgba(242,189,81,.08));box-shadow:var(--shadow);margin-bottom:14px}.icon-large{width:180px;height:180px;border-radius:18px}.hero h1{margin:0 0 5px;font-size:28px;line-height:1.25}.hero-sub{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.hero-actions{display:grid;gap:8px}.hero-actions .btn{width:100%}
.compare-wrap{border:1px solid var(--line);border-radius:18px;background:rgba(17,26,45,.88);padding:12px;margin-bottom:14px}.compare-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.compare-head b{color:var(--cyan);font-size:13px}.compare-head span{color:var(--muted);font-size:11px}.compare-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.compare-card{flex:0 0 116px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025);padding:8px;color:inherit;text-align:left}.compare-card.active{border-color:rgba(242,189,81,.8);background:rgba(242,189,81,.09)}.compare-icon{width:98px;height:88px;border-radius:10px;margin-bottom:6px}.compare-name{font-size:11px;font-weight:800;line-height:1.35;height:30px;overflow:hidden}.compare-meta{font-size:9px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:5px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{flex:0 0 auto;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:11px 11px 0 0;font-size:12px;font-weight:900}.tab.active{color:var(--gold);border-color:var(--line);background:rgba(242,189,81,.09)}
.card{border:1px solid var(--line);border-radius:17px;background:rgba(17,26,45,.9);padding:15px;margin-bottom:13px}.card h2{margin:0 0 13px;font-size:14px;color:var(--cyan)}.grid{display:grid;gap:11px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols5{grid-template-columns:repeat(5,minmax(0,1fr))}.cols6{grid-template-columns:repeat(6,minmax(0,1fr))}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:5px}.field .hint{font-size:10px;color:#70809a;margin-top:4px}.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(255,255,255,.025);font-size:12px;font-weight:800}.check input{width:auto}.separator{height:1px;background:var(--line);margin:12px 0}.muted{color:var(--muted);font-size:11px;line-height:1.6}.stat-grid{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:9px}.elem-grid{display:grid;grid-template-columns:120px repeat(7,minmax(72px,1fr));gap:7px;align-items:center}.elem-label{font-size:11px;color:var(--muted);font-weight:900}.small-input{padding:8px}.kv-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end;margin-bottom:8px}.list-editor{display:grid;gap:8px}.jsonbox{min-height:420px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;white-space:pre}.warn{border:1px solid rgba(242,189,81,.4);background:rgba(242,189,81,.08);border-radius:12px;padding:10px;font-size:11px;color:#ffe7b4;line-height:1.6}.exportbox{min-height:520px;color:#b9ffe5;background:#030711;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.45}
@media(max-width:1150px){.layout{grid-template-columns:310px 1fr}.hero{grid-template-columns:140px 1fr}.icon-large{width:140px;height:140px}.hero-actions{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}.stat-grid{grid-template-columns:repeat(4,1fr)}.elem-grid{grid-template-columns:100px repeat(4,1fr)}}
@media(max-width:800px){body{overflow:auto}.app{height:auto;min-height:100%;display:block}.topbar{position:sticky;top:0}.layout{display:block}.sidebar{height:410px;border-right:0;border-bottom:1px solid var(--line)}.main{overflow:visible}.hero{grid-template-columns:100px 1fr}.icon-large{width:100px;height:100px}.stat-grid,.cols4,.cols5,.cols6{grid-template-columns:repeat(2,1fr)}.elem-grid{grid-template-columns:90px repeat(2,1fr)}.top-stats{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><strong>PRISMA ABYSS</strong><span>Equipment Editor / アイコン比較・名称・装備マスター編集</span></div>
    <div class="top-actions">
      <button class="btn" id="loadBtn">equips.js読込</button>
      <button class="btn gold" id="exportTabBtn">JS出力</button>
      <button class="btn green" id="downloadBtn">equips.js保存</button>
    </div>
    <div class="top-stats" id="topStats"></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <input id="search" placeholder="EID / 名前 / 種別 / 系統で検索" />
        <div class="filter-grid">
          <select id="rankFilter"><option value="all">全Rank</option></select>
          <select id="typeFilter"><option value="all">全種別</option></select>
        </div>
        <div class="filter-grid">
          <select id="sortMode"><option value="eid">EID順</option><option value="rank">Rank順</option><option value="name">名前順</option><option value="type">種別順</option></select>
          <select id="specialFilter"><option value="all">通常＋特殊</option><option value="normal">通常のみ</option><option value="special">特殊のみ</option><option value="norandom">ランダム生成不可</option></select>
        </div>
      </div>
      <div class="equip-list" id="equipList"></div>
      <div class="side-actions"><button class="btn primary" id="addBtn">＋新規装備</button><button class="btn" id="sortBtn">EID整列</button></div>
    </aside>
    <main class="main" id="main"><div class="empty">装備を選択してください</div></main>
  </div>
</div>
<input type="file" id="fileInput" accept=".js,text/javascript" hidden />
<script>
(function(){
"use strict";
const ELEMENTS=["火","水","風","雷","光","闇","混沌"];
const CORE_STATS=["hp","mp","atk","def","mag","mdef","spd","hit","eva","cri","finDmg","finRed"];
const STATUS_FIELDS=["attack_Poison","attack_InstantDeath","attack_Fear","resists_Debuff","resists_Fear","resists_SpellSeal","resists_InstantDeath","resists_Shock","resists_HealSeal","resists_SkillSeal"];
const LABELS={hp:"HP",mp:"MP",atk:"攻撃",def:"防御",mag:"魔力",mdef:"魔防",spd:"素早さ",hit:"命中",eva:"回避",cri:"会心",finDmg:"最終与ダメ%",finRed:"最終被ダメ軽減%",attack_Poison:"毒付与%",attack_InstantDeath:"即死付与%",attack_Fear:"恐怖付与%",resists_Debuff:"弱体耐性%",resists_Fear:"恐怖耐性%",resists_SpellSeal:"呪文封印耐性%",resists_InstantDeath:"即死耐性%",resists_Shock:"ショック耐性%",resists_HealSeal:"回復封印耐性%",resists_SkillSeal:"特技封印耐性%"};
const TABS=[["basic","基本"],["elements","属性・状態"],["traits","特性・スキル"],["json","JSON"],["export","JS出力"]];
const state={equips:[],selected:null,tab:"basic",q:"",rank:"all",type:"all",sort:"eid",special:"all",dirty:false};
const $=s=>document.querySelector(s); const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const n=v=>{if(v===""||v===null||v===undefined)return null;const x=Number(v);return Number.isFinite(x)?x:null};
function uid(){return "e"+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function normalize(e){const x=clone(e||{});x._uid=uid();x.eid=Number(x.eid||0);x.noRandom=!!x.noRandom;x.specialEquip=!!x.specialEquip;x.rank=Number(x.rank||1);x.name=String(x.name||"");x.type=String(x.type||"武器");x.baseName=String(x.baseName||"");x.data=x.data&&typeof x.data==="object"?x.data:{};x.possibleOpts=Array.isArray(x.possibleOpts)?x.possibleOpts:[];x.traits=Array.isArray(x.traits)?x.traits.map(t=>typeof t==="number"?{id:t,level:1}:clone(t)):[];if(x.grantSkills!==undefined&&!Array.isArray(x.grantSkills))x.grantSkills=[];return x}
function clean(e){const x=clone(e);delete x._uid;x.eid=Number(x.eid);x.rank=Number(x.rank);if(!x.specialEquip)delete x.specialEquip;if(!Array.isArray(x.grantSkills)||!x.grantSkills.length)delete x.grantSkills;for(const k of Object.keys(x.data||{})){const v=x.data[k];if(v&&typeof v==="object"&&!Array.isArray(v)){for(const kk of Object.keys(v)){const nn=n(v[kk]);if(nn===null)delete v[kk];else v[kk]=nn}if(!Object.keys(v).length)delete x.data[k]}else{const nn=n(v);if(nn===null)delete x.data[k];else x.data[k]=nn}}x.traits=(x.traits||[]).map(t=>({id:Number(t.id||0),level:Number(t.level||1)})).filter(t=>t.id>0);x.possibleOpts=(x.possibleOpts||[]).map(String).filter(Boolean);if(x.grantSkills)x.grantSkills=x.grantSkills.map(Number).filter(Number.isFinite);return x}
function init(){const raw=Array.isArray(window.EQUIP_MASTER)?window.EQUIP_MASTER:[];state.equips=raw.map(normalize);state.selected=state.equips[0]?._uid||null;populateFilters();bindGlobal();render();}
function populateFilters(){const ranks=[...new Set(state.equips.map(e=>e.rank))].sort((a,b)=>a-b);const types=[...new Set(state.equips.map(e=>e.type))].sort((a,b)=>a.localeCompare(b,"ja"));$("#rankFilter").innerHTML='<option value="all">全Rank</option>'+ranks.map(r=>`<option value="${r}">Rank ${r}</option>`).join("");$("#typeFilter").innerHTML='<option value="all">全種別</option>'+types.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");}
function selected(){return state.equips.find(e=>e._uid===state.selected)||null}
function filtered(){const q=state.q.trim().toLowerCase();let a=state.equips.filter(e=>{if(state.rank!=="all"&&String(e.rank)!==state.rank)return false;if(state.type!=="all"&&e.type!==state.type)return false;if(state.special==="normal"&&e.specialEquip)return false;if(state.special==="special"&&!e.specialEquip)return false;if(state.special==="norandom"&&!e.noRandom)return false;if(q&&!`${e.eid} ${e.name} ${e.type} ${e.baseName}`.toLowerCase().includes(q))return false;return true});a=a.slice().sort((a,b)=>state.sort==="rank"?(a.rank-b.rank||a.eid-b.eid):state.sort==="name"?a.name.localeCompare(b.name,"ja"):state.sort==="type"?(a.type.localeCompare(b.type,"ja")||a.rank-b.rank||a.eid-b.eid):a.eid-b.eid);return a}
function imageCandidates(e){return [`assets/equips/${e.eid}.png`,`equips/${e.eid}.png`];}
function imageHTML(e,cls=""){const c=imageCandidates(e);return `<div class="${cls}" data-icon-host><img src="${c[0]}" data-fallback="${c[1]}" alt="${esc(e.name)}" onerror="window.__equipIconFallback(this)"></div>`}
window.__equipIconFallback=function(img){const fb=img.dataset.fallback;if(fb&&img.src&&!img.dataset.usedFallback){img.dataset.usedFallback="1";img.src=fb;return}const host=img.parentElement;if(host){host.innerHTML='<span class="thumb-missing">NO ICON</span>'}}
function render(){renderStats();renderList();renderMain();}
function renderStats(){const s=selected();$("#topStats").textContent=`${state.equips.length}件${state.dirty?" / 未保存変更あり":""}${s?` / EID ${s.eid}`:""}`}
function renderList(){const list=filtered();$("#equipList").innerHTML=list.map(e=>`<button class="equip-row ${e._uid===state.selected?"active":""}" data-select="${e._uid}">${imageHTML(e,"thumb")}<div class="row-main"><div class="row-title"><span class="eid">${e.eid}</span><b>${esc(e.name)}</b></div><div class="row-meta"><span class="tag">Rank ${e.rank}</span><span class="tag">${esc(e.type)}</span><span class="tag">${esc(e.baseName)}</span>${e.specialEquip?'<span class="tag special">特殊</span>':""}</div></div></button>`).join("")||'<div class="empty" style="height:auto;padding:30px">該当なし</div>';document.querySelectorAll("[data-select]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.select;state.tab="basic";render()})}
function compareList(e){return state.equips.filter(x=>x.rank===e.rank&&x.type===e.type).sort((a,b)=>a.eid-b.eid)}
function renderMain(){const e=selected();if(!e){$("#main").innerHTML='<div class="empty">装備を選択してください</div>';return}const comp=compareList(e);$("#main").innerHTML=`
<div class="hero">${imageHTML(e,"icon-large")}<div><div class="eid">EID ${e.eid}</div><h1>${esc(e.name)||"（名称未設定）"}</h1><div class="hero-sub"><span>Rank ${e.rank}</span><span>${esc(e.type)}</span><span>${esc(e.baseName)}</span>${e.noRandom?'<span>ランダム生成不可</span>':""}${e.specialEquip?'<span>特殊装備</span>':""}</div></div><div class="hero-actions"><button class="btn primary" data-focus-name>名称を編集</button><button class="btn" data-clone>複製</button><button class="btn red" data-delete>削除</button></div></div>
<div class="compare-wrap"><div class="compare-head"><b>同Rank・同種別を見比べる</b><span>${comp.length}件 / クリックで切替</span></div><div class="compare-strip">${comp.map(x=>`<button class="compare-card ${x._uid===e._uid?"active":""}" data-compare="${x._uid}">${imageHTML(x,"compare-icon")}<div class="compare-name">${esc(x.name)}</div><div class="compare-meta">EID ${x.eid} / ${esc(x.baseName)}</div></button>`).join("")}</div></div>
<div class="tabs">${TABS.map(([id,label])=>`<button class="tab ${state.tab===id?"active":""}" data-tab="${id}">${label}</button>`).join("")}</div><div id="tabBody"></div>`;
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderMain()});document.querySelectorAll("[data-compare]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.compare;render()});const fn=$("[data-focus-name]");if(fn)fn.onclick=()=>{state.tab="basic";renderMain();setTimeout(()=>$("#nameField")?.focus(),0)};$("[data-clone]").onclick=cloneSelected;$("[data-delete]").onclick=deleteSelected;renderTab(e)}
function renderTab(e){const body=$("#tabBody");if(state.tab==="basic")body.innerHTML=basicHTML(e);else if(state.tab==="elements")body.innerHTML=elementsHTML(e);else if(state.tab==="traits")body.innerHTML=traitsHTML(e);else if(state.tab==="json")body.innerHTML=jsonHTML(e);else body.innerHTML=exportHTML();bindTab(e)}
function field(label,key,val,type="text",extra=""){return `<div class="field"><label>${label}</label><input ${extra} type="${type}" data-field="${key}" value="${esc(val??"")}"></div>`}
function basicHTML(e){return `<div class="card"><h2>識別・名称</h2><div class="grid cols4">${field("EID","eid",e.eid,"number",'min="1"')}${field("Rank","rank",e.rank,"number",'min="1"')}${field("名称","name",e.name,"text",'id="nameField"')}${field("装備系統 baseName","baseName",e.baseName)}</div><div class="grid cols4" style="margin-top:11px"><div class="field"><label>種別</label><select data-field="type">${["武器","盾","頭","体","足"].map(t=>`<option ${e.type===t?"selected":""}>${t}</option>`).join("")}<option value="${esc(e.type)}" ${!["武器","盾","頭","体","足"].includes(e.type)?"selected":""}>${esc(e.type)}</option></select></div><label class="check"><input type="checkbox" data-bool="noRandom" ${e.noRandom?"checked":""}>ランダム生成不可</label><label class="check"><input type="checkbox" data-bool="specialEquip" ${e.specialEquip?"checked":""}>特殊装備</label><div class="field"><label>アイコン参照</label><input value="assets/equips/${e.eid}.png" readonly></div></div></div><div class="card"><h2>基礎性能</h2><div class="stat-grid">${CORE_STATS.map(k=>field(LABELS[k],`data.${k}`,e.data[k]??"","number",'step="1"')).join("")}</div><div class="muted" style="margin-top:10px">空欄は data から削除して出力します。0を明示したい場合は0を入力してください。</div></div>`}
function elementsHTML(e){const atk=e.data.elmAtk||{},res=e.data.elmRes||{};return `<div class="card"><h2>属性攻撃・属性耐性</h2><div class="elem-grid"><div></div>${ELEMENTS.map(x=>`<div class="elem-label">${x}</div>`).join("")}<div class="elem-label">属性攻撃</div>${ELEMENTS.map(x=>`<input class="small-input" type="number" data-element="elmAtk" data-element-key="${x}" value="${esc(atk[x]??"")}">`).join("")}<div class="elem-label">属性耐性</div>${ELEMENTS.map(x=>`<input class="small-input" type="number" data-element="elmRes" data-element-key="${x}" value="${esc(res[x]??"")}">`).join("")}</div></div><div class="card"><h2>状態異常付与・耐性</h2><div class="grid cols5">${STATUS_FIELDS.map(k=>field(LABELS[k],`data.${k}`,e.data[k]??"","number",'step="1"')).join("")}</div></div>`}
function traitsHTML(e){const traits=e.traits||[];const grants=e.grantSkills||[];return `<div class="card"><h2>パッシブ特性</h2><div class="list-editor" id="traitRows">${traits.map((t,i)=>`<div class="kv-row"><div class="field"><label>特性ID</label><input type="number" data-trait-id="${i}" value="${esc(t.id??"")}"></div><div class="field"><label>Lv</label><input type="number" min="1" data-trait-lv="${i}" value="${esc(t.level??1)}"></div><button class="btn red small" data-remove-trait="${i}">削除</button></div>`).join("")||'<div class="muted">特性なし</div>'}</div><button class="btn small" data-add-trait>＋特性追加</button></div><div class="card"><h2>付与スキル</h2><div class="list-editor">${grants.map((id,i)=>`<div class="kv-row" style="grid-template-columns:1fr auto"><div class="field"><label>スキルID</label><input type="number" data-grant="${i}" value="${esc(id)}"></div><button class="btn red small" data-remove-grant="${i}">削除</button></div>`).join("")||'<div class="muted">付与スキルなし</div>'}</div><button class="btn small" data-add-grant>＋スキル追加</button></div><div class="card"><h2>possibleOpts</h2><div class="field"><label>候補キー（1行1件）</label><textarea data-possible style="min-height:160px">${esc((e.possibleOpts||[]).join("\n"))}</textarea><div class="hint">ランダム付与候補として既存マスターに保存されているキーを編集します。</div></div></div>`}
function jsonHTML(e){return `<div class="card"><h2>この装備のJSON</h2><div class="warn">高度な編集用です。「JSONを適用」で現在の装備を置換します。EID重複には注意してください。</div><textarea id="jsonEdit" class="jsonbox">${esc(JSON.stringify(clean(e),null,2))}</textarea><div style="margin-top:10px"><button class="btn gold" data-apply-json>JSONを適用</button></div></div>`}
function exportSource(){const data=state.equips.slice().sort((a,b)=>a.eid-b.eid).map(clean);return `/* equips.js - direct source equipment balance generated ${new Date().toISOString().slice(0,10)} */\nconst EQUIP_MASTER = ${JSON.stringify(data,null,4)};\n\nwindow.EQUIP_MASTER = EQUIP_MASTER;\n`;}
function exportHTML(){const src=exportSource();return `<div class="card"><h2>equips.js 出力</h2><div class="warn">全装備をEID順で出力します。既存 equips.js と置き換えて使用できます。</div><div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn green" data-download-export>equips.jsをダウンロード</button><button class="btn" data-copy-export>コピー</button></div><textarea class="exportbox" readonly id="exportBox">${esc(src)}</textarea></div>`}
function setNested(obj,path,val){const parts=path.split(".");let cur=obj;for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]&&typeof cur[parts[i]]==="object"?cur[parts[i]]:{};cur=cur[parts[i]]}const k=parts.at(-1);if(path.startsWith("data.")){const nn=n(val);if(nn===null)delete cur[k];else cur[k]=nn}else if(["eid","rank"].includes(k)){const nn=n(val);if(nn!==null)cur[k]=nn}else cur[k]=val}
function bindTab(e){document.querySelectorAll("[data-field]").forEach(el=>el.onchange=()=>{setNested(e,el.dataset.field,el.value);markDirty();if(["eid","rank","name","type","baseName"].some(k=>el.dataset.field===k)){populateFilters();render()}});document.querySelectorAll("[data-bool]").forEach(el=>el.onchange=()=>{e[el.dataset.bool]=el.checked;markDirty();render()});document.querySelectorAll("[data-element]").forEach(el=>el.onchange=()=>{const bucket=el.dataset.element,key=el.dataset.elementKey,nn=n(el.value);e.data[bucket]=e.data[bucket]&&typeof e.data[bucket]==="object"?e.data[bucket]:{};if(nn===null)delete e.data[bucket][key];else e.data[bucket][key]=nn;if(!Object.keys(e.data[bucket]).length)delete e.data[bucket];markDirty()});document.querySelectorAll("[data-trait-id]").forEach(el=>el.onchange=()=>{e.traits[Number(el.dataset.traitId)].id=Number(el.value||0);markDirty()});document.querySelectorAll("[data-trait-lv]").forEach(el=>el.onchange=()=>{e.traits[Number(el.dataset.traitLv)].level=Number(el.value||1);markDirty()});document.querySelectorAll("[data-remove-trait]").forEach(b=>b.onclick=()=>{e.traits.splice(Number(b.dataset.removeTrait),1);markDirty();renderMain()});const at=$("[data-add-trait]");if(at)at.onclick=()=>{e.traits.push({id:0,level:1});markDirty();renderMain()};document.querySelectorAll("[data-grant]").forEach(el=>el.onchange=()=>{e.grantSkills=e.grantSkills||[];e.grantSkills[Number(el.dataset.grant)]=Number(el.value||0);markDirty()});document.querySelectorAll("[data-remove-grant]").forEach(b=>b.onclick=()=>{e.grantSkills.splice(Number(b.dataset.removeGrant),1);markDirty();renderMain()});const ag=$("[data-add-grant]");if(ag)ag.onclick=()=>{e.grantSkills=e.grantSkills||[];e.grantSkills.push(0);markDirty();renderMain()};const po=$("[data-possible]");if(po)po.onchange=()=>{e.possibleOpts=po.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);markDirty()};const aj=$("[data-apply-json]");if(aj)aj.onclick=()=>{try{const x=normalize(JSON.parse($("#jsonEdit").value));const idx=state.equips.findIndex(z=>z._uid===e._uid);x._uid=e._uid;state.equips[idx]=x;markDirty();populateFilters();render()}catch(err){alert("JSONを適用できません: "+err.message)}};const de=$("[data-download-export]");if(de)de.onclick=download;const ce=$("[data-copy-export]");if(ce)ce.onclick=()=>navigator.clipboard.writeText(exportSource()).then(()=>alert("コピーしました"));}
function markDirty(){state.dirty=true;renderStats()}
function cloneSelected(){const e=selected();if(!e)return;const x=normalize(clean(e));const max=Math.max(...state.equips.map(z=>z.eid),0);x.eid=max+1;x.name=e.name+"（複製）";state.equips.push(x);state.selected=x._uid;markDirty();populateFilters();render()}
function deleteSelected(){const e=selected();if(!e||!confirm(`EID ${e.eid}「${e.name}」を削除しますか？`))return;const i=state.equips.findIndex(x=>x._uid===e._uid);state.equips.splice(i,1);state.selected=state.equips[Math.min(i,state.equips.length-1)]?._uid||null;markDirty();populateFilters();render()}
function addNew(){const max=Math.max(...state.equips.map(z=>z.eid),0);const x=normalize({eid:max+1,noRandom:false,rank:1,name:"新規装備",type:"武器",baseName:"剣",data:{},possibleOpts:[],traits:[]});state.equips.push(x);state.selected=x._uid;markDirty();populateFilters();render()}
function download(){const blob=new Blob([exportSource()],{type:"text/javascript;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="equips.js";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0);state.dirty=false;renderStats()}
function parseEquipJs(text){const m=text.match(/const\s+EQUIP_MASTER\s*=\s*(\[[\s\S]*?\])\s*;\s*(?:\r?\n)+\s*window\.EQUIP_MASTER/);if(!m)throw new Error("EQUIP_MASTER 配列を見つけられません");return Function(`"use strict";return (${m[1]});`)()}
function bindGlobal(){$("#search").oninput=e=>{state.q=e.target.value;renderList()};$("#rankFilter").onchange=e=>{state.rank=e.target.value;renderList()};$("#typeFilter").onchange=e=>{state.type=e.target.value;renderList()};$("#sortMode").onchange=e=>{state.sort=e.target.value;renderList()};$("#specialFilter").onchange=e=>{state.special=e.target.value;renderList()};$("#addBtn").onclick=addNew;$("#sortBtn").onclick=()=>{state.sort="eid";$("#sortMode").value="eid";renderList()};$("#downloadBtn").onclick=download;$("#exportTabBtn").onclick=()=>{state.tab="export";renderMain()};$("#loadBtn").onclick=()=>$("#fileInput").click();$("#fileInput").onchange=async ev=>{const f=ev.target.files?.[0];if(!f)return;if(state.dirty&&!confirm("未保存変更があります。読込で破棄しますか？")){ev.target.value="";return}try{const arr=parseEquipJs(await f.text());state.equips=arr.map(normalize);state.selected=state.equips[0]?._uid ?? null;state.dirty=false;state.q="";$("#search").value="";populateFilters();render()}catch(err){alert("読込に失敗しました: "+err.message)}ev.target.value=""};window.addEventListener("beforeunload",ev=>{if(state.dirty){ev.preventDefault();ev.returnValue=""}});document.addEventListener("keydown",ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="s"){ev.preventDefault();download()}})}
init();
})();
</script>
</body>
</html>
