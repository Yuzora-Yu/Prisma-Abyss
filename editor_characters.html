<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRISMA ABYSS - Characters Editor</title>
<script src="skills.js"></script><script src="job_data.js"></script><script src="characters.js"></script>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--panel2:#18233c;--line:#2b3854;--muted:#9aa7bd;--text:#eef4ff;--accent:#f2b84b;--accent2:#61d3ff;--ok:#43d18a;--input:#0d1528}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line);background:#0d1425;gap:12px}.brand strong{color:var(--accent);font-size:18px}.brand span{color:var(--muted);font-size:12px;margin-left:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:9px;font-weight:800}.btn.green{background:#12683f;border-color:#23a96b}.btn.primary{background:#255ec8;border-color:#397bff}.btn.danger{background:#76273a;border-color:#b94d65}.layout{min-height:0;display:grid;grid-template-columns:320px 1fr}.side{min-height:0;display:grid;grid-template-rows:auto 1fr;border-right:1px solid var(--line);background:#0e1527}.sidehead{padding:12px;border-bottom:1px solid var(--line)}input,select,textarea{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.charlist{overflow:auto;padding:8px}.charrow{width:100%;border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;padding:9px 10px;text-align:left;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}.charrow:hover{background:rgba(255,255,255,.05)}.charrow.active{border-color:var(--accent);background:rgba(242,184,75,.1)}.charrow small{color:var(--muted)}.main{min-width:0;min-height:0;overflow:auto;padding:18px}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.hero h1{margin:0 0 5px;font-size:24px}.meta{color:var(--muted);font-size:12px;line-height:1.6}.card h2{margin:0 0 12px;color:var(--accent2);font-size:15px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}label{color:var(--muted);font-size:11px;font-weight:800}.field label{display:block;margin-bottom:5px}.lbcard{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:start;margin-bottom:9px}.lbtag{color:var(--accent);font-weight:900;padding-top:9px}.skilldesc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}.details{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.details summary{cursor:pointer;color:var(--muted);font-weight:800;margin-bottom:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:30px;z-index:50}.modal.open{display:flex}.dialog{width:min(1100px,96vw);height:min(82vh,850px);background:#0d1425;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.dialog textarea{height:100%;resize:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre}.dialoghead{display:flex;justify-content:space-between;align-items:center}.dialoghead h2{margin:0;font-size:16px}.status{font-size:12px;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:250px 1fr}.g5{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><strong>CHARACTERS EDITOR</strong><span>editor_characters.html</span></div><div class="actions"><button class="btn" id="previewBtn">JSプレビュー</button><button class="btn green" id="downloadBtn">characters.js 出力</button><button class="btn danger" id="resetBtn">全変更をリセット</button></div></header><div class="layout"><aside class="side"><div class="sidehead"><input id="search" placeholder="キャラ名 / ID / 職業で検索"></div><div id="charList" class="charlist"></div></aside><main class="main"><div id="editor"></div></main></div></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2>characters.js プレビュー</h2><button class="btn" id="closeModal">閉じる</button></div><textarea id="exportText" spellcheck="false"></textarea><div><button class="btn primary" id="copyBtn">コピー</button> <span class="status" id="status"></span></div></div></div>
<script>
(()=>{'use strict';const clone=v=>JSON.parse(JSON.stringify(v));const initial=clone(Array.isArray(window.CHARACTERS_DATA)?window.CHARACTERS_DATA:[]);const state={chars:clone(initial),jobs:clone(Array.isArray(window.JOB_MASTER_DATA)?window.JOB_MASTER_DATA:[]),skills:clone(Array.isArray(window.SKILLS_DATA)?window.SKILLS_DATA:[]).sort((a,b)=>Number(a.id)-Number(b.id)),selectedId:null,query:''};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cur=()=>state.chars.find(c=>Number(c.id)===Number(state.selectedId))||state.chars[0]||null;const skill=id=>state.skills.find(s=>Number(s.id)===Number(id))||null;const skillLabel=s=>{if(!s)return '未設定';const meta=[s.type,s.target,Number(s.mp)>0?`MP${s.mp}`:'MP0'].filter(Boolean).join('/');return `ID ${String(s.id).padStart(3,'0')}｜${s.name||'名称なし'}｜${meta}｜${s.desc||'効果説明なし'}`};
function skillOptions(value){let out='<option value="">— 未設定 —</option>';for(const s of state.skills)out+=`<option value="${s.id}" ${Number(value)===Number(s.id)?'selected':''}>${esc(skillLabel(s))}</option>`;return out}function jobOptions(name){const known=state.jobs.some(j=>j.name===name);const legacy=!known&&name?`<option value="${esc(name)}" selected>現行（JOB_MASTER外）｜${esc(name)}</option>`:'';return legacy+state.jobs.map(j=>`<option value="${esc(j.name)}" ${j.name===name?'selected':''}>ID ${j.id}｜${esc(j.name)}</option>`).join('')}
function renderList(){if(state.selectedId==null&&state.chars.length)state.selectedId=state.chars[0].id;const q=state.query.trim().toLowerCase();$('charList').innerHTML=state.chars.filter(c=>!q||String(c.id).includes(q)||String(c.name).toLowerCase().includes(q)||String(c.job||'').toLowerCase().includes(q)).map(c=>`<button class="charrow ${Number(c.id)===Number(state.selectedId)?'active':''}" data-id="${c.id}"><span>${esc(c.name)}</span><small>${c.id} / ${esc(c.job||'')}</small></button>`).join('');$('charList').querySelectorAll('.charrow').forEach(b=>b.onclick=()=>{state.selectedId=Number(b.dataset.id);renderList();renderEditor()})}
const baseKeys=[['hp','HP'],['mp','MP'],['atk','攻撃力'],['def','防御力'],['mag','魔力'],['mdef','魔法防御'],['spd','素早さ'],['hit','命中'],['eva','回避'],['cri','会心']];const seven=[['hp','HP'],['mp','MP'],['atk','攻撃力'],['def','防御力'],['mag','魔力'],['mdef','魔法防御'],['spd','素早さ']];
function numField(key,label,value,scope='base'){return `<div class="field"><label>${label}</label><input type="number" step="1" data-scope="${scope}" data-key="${key}" value="${Number(value??0)}"></div>`}
function renderEditor(){const c=cur();if(!c){$('editor').innerHTML='キャラクターデータがありません。';return}c.lbSkills=c.lbSkills&&typeof c.lbSkills==='object'?c.lbSkills:{'30':null,'50':null,'99':null};const lb=level=>{const sid=c.lbSkills[String(level)];const sk=skill(sid);return `<div class="lbcard"><div class="lbtag">LB ${level}</div><div><select data-lb="${level}">${skillOptions(sid)}</select><div class="skilldesc">${sk?`${esc(sk.name)}：${esc(sk.desc||'効果説明なし')}`:'未設定'}</div></div></div>`};const base=baseKeys.map(([k,l])=>numField(k,l,c[k],'base')).join('');const lbBase=seven.map(([k,l])=>numField(k,l,c.lbBase?.[k]??c[k],'lbBase')).join('');const growth=seven.map(([k,l])=>numField(k,l,c.growthBase?.[k]??0,'growthBase')).join('');
$('editor').innerHTML=`<section class="hero"><div><h1>${esc(c.name)}</h1><div class="meta">Character ID ${c.id} ／ ${esc(c.race||'種族未設定')} ／ ${esc(c.rarity||'レアリティ未設定')}</div></div><div class="field" style="min-width:260px"><label>職業</label><select id="jobSelect">${jobOptions(c.job)}</select></div></section><section class="card"><h2>基礎ステータス</h2><div class="grid g5">${base}</div></section><section class="card"><h2>LB習得スキル</h2>${lb(30)}${lb(50)}${lb(99)}</section><section class="card"><details class="details"><summary>成長基準 / LB基準も編集する</summary><p class="meta">基礎値とは別管理です。必要な場合だけ変更してください。既存値はそのまま保持されます。</p><h2>LB基準値 (lbBase)</h2><div class="grid g5">${lbBase}</div><div style="height:14px"></div><h2>レベル成長基準 (growthBase)</h2><div class="grid g5">${growth}</div></details></section>`;
$('jobSelect').onchange=e=>{c.job=e.target.value;renderList()};$('editor').querySelectorAll('input[data-scope]').forEach(i=>i.onchange=()=>{const v=Number(i.value);const scope=i.dataset.scope,key=i.dataset.key;if(scope==='base')c[key]=v;else{if(!c[scope]||typeof c[scope]!=='object')c[scope]={};c[scope][key]=v}});$('editor').querySelectorAll('select[data-lb]').forEach(sel=>sel.onchange=()=>{const level=String(sel.dataset.lb);c.lbSkills[level]=sel.value===''?null:Number(sel.value);renderEditor()})}
function generate(){return `/* characters.js - edited with editor_characters.html */\nwindow.CHARACTERS_DATA = ${JSON.stringify(state.chars,null,4)};\n`}
function preview(){const t=generate();$('exportText').value=t;$('modal').classList.add('open');$('status').textContent=`${state.chars.length}キャラクター / ${state.skills.length}スキル参照`}
function download(){const t=generate();const blob=new Blob([t],{type:'text/javascript;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='characters.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('search').oninput=e=>{state.query=e.target.value;renderList()};$('previewBtn').onclick=preview;$('downloadBtn').onclick=download;$('closeModal').onclick=()=>$('modal').classList.remove('open');$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('exportText').value);$('status').textContent='コピーしました'};$('resetBtn').onclick=()=>{if(!confirm('編集中の変更をすべて破棄して、読み込み時のcharacters.jsへ戻しますか？'))return;state.chars=clone(initial);state.selectedId=state.chars[0]?.id??null;renderList();renderEditor()};state.selectedId=state.chars[0]?.id??null;renderList();renderEditor();})();
</script></body></html>
