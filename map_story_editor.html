<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="assets.js"></script>

<style>
:root{--bg:#07101e;--panel:#0d182b;--panel2:#13223a;--panel3:#081323;--line:#2a3b58;--text:#edf5ff;--muted:#95a6c1;--accent:#f6c45c;--blue:#67d7ff;--ok:#55d998;--warn:#ffd56c;--danger:#ff6f82;--shadow:0 20px 55px rgba(0,0,0,.34)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{color:var(--text);background:#071426;border:1px solid var(--line);border-radius:9px;padding:7px 9px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(246,196,92,.11)}textarea{width:100%;min-height:120px;resize:vertical;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:#091426;z-index:10}.brand{min-width:230px}.brand b{color:var(--accent);font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.top-spacer{flex:1}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:7px 10px;font-weight:800;white-space:nowrap}.btn:hover{filter:brightness(1.08)}.btn.primary{background:#245fca;border-color:#3a7cff}.btn.gold{background:#765116;border-color:#c9922c}.btn.green{background:#126a42;border-color:#2cab73}.btn.red{background:#81273a;border-color:#c94c64}.btn.ghost{background:transparent}.btn.small{padding:4px 7px;font-size:11px}.status{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.layout{min-height:0;display:grid;grid-template-columns:286px minmax(520px,1fr) 390px}.side{min-height:0;background:#081321;border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr auto}.worktabs,.worldtabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:1px solid transparent;background:transparent;color:var(--muted);font-weight:900;border-radius:9px;padding:7px 9px;white-space:nowrap}.tab.active{color:var(--accent);background:rgba(246,196,92,.11);border-color:rgba(246,196,92,.28)}.search{padding:8px;border-bottom:1px solid var(--line)}.list{overflow:auto;padding:7px}.entry{display:block;width:100%;text-align:left;border:1px solid transparent;background:rgba(255,255,255,.035);color:var(--text);padding:9px;border-radius:11px;margin-bottom:6px}.entry:hover{border-color:var(--line)}.entry.active{border-color:var(--accent);background:rgba(246,196,92,.09)}.entry b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.entry small{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-foot{padding:8px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.5}.center{min-height:0;display:grid;grid-template-rows:48px 1fr 178px;background:#020711}.canvasbar{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#0b1729;border-bottom:1px solid var(--line)}.canvasbar .title{font-weight:900;color:var(--blue);min-width:130px}.canvasbar label{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}.canvasbar input[type=range]{width:110px;padding:0}.canvaswrap{overflow:auto;position:relative;background:radial-gradient(circle at 50% 50%,#071425,#020711 70%)}.stage{display:inline-block;position:relative;padding:18px;min-width:100%;min-height:100%}canvas{display:block;image-rendering:pixelated;background:#040a12;border:1px solid var(--line);box-shadow:var(--shadow)}.coord{position:sticky;left:22px;top:8px;display:inline-block;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:4px 7px;font:11px ui-monospace,monospace;pointer-events:none;z-index:4}.palette{border-top:1px solid var(--line);background:#091426;padding:8px;overflow:auto}.palette-head{display:flex;gap:8px;align-items:center;margin-bottom:7px}.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}.tile{border:1px solid var(--line);background:#0d1b30;color:#fff;border-radius:8px;min-height:40px;font-weight:900;position:relative;overflow:hidden}.tile.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(246,196,92,.18)}.tile i{position:absolute;inset:0;opacity:.55}.tile span{position:relative;text-shadow:0 1px 3px #000}.right{min-height:0;border-left:1px solid var(--line);background:#091321;display:grid;grid-template-rows:auto 1fr}.right-head{padding:10px 11px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}.right-body{overflow:auto;padding:10px}.card{border:1px solid var(--line);background:rgba(18,31,53,.92);border-radius:13px;padding:11px;margin-bottom:9px}.card h3{margin:0 0 9px;color:var(--blue);font-size:13px}.grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}label{display:block;color:var(--muted);font-size:10px;font-weight:800}label input,label select{margin-top:4px;width:100%}.hint{color:var(--muted);font-size:10px;line-height:1.55}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 6px;color:var(--muted);font-size:10px}.badge.ok{color:#caffdf;border-color:rgba(85,217,152,.45)}.badge.warn{color:#ffe8a5;border-color:rgba(255,213,108,.45)}.badge.danger{color:#ffd2d8;border-color:rgba(255,111,130,.45)}.objectchips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#0b1729;color:var(--muted);border-radius:999px;padding:4px 7px;font-size:10px}.chip.active{color:var(--accent);border-color:rgba(246,196,92,.4)}.message{border:1px solid rgba(103,215,255,.28);background:rgba(103,215,255,.07);color:#d7f7ff;border-radius:10px;padding:8px;font-size:10px;line-height:1.55;margin-bottom:8px}.message.warn{border-color:rgba(255,213,108,.35);background:rgba(255,213,108,.07);color:#ffe9ae}.message.danger{border-color:rgba(255,111,130,.35);background:rgba(255,111,130,.07);color:#ffd3da}.raw{min-height:210px}.hidden{display:none!important}.kbd{font:10px ui-monospace,monospace;color:#ffe2a1}@media(max-width:1200px){.layout{grid-template-columns:240px minmax(470px,1fr) 330px}}@media(max-width:900px){body{overflow:auto}.app{height:auto}.layout{display:block}.side{height:420px}.center{height:760px}.right{height:auto}.top{position:sticky;top:0}.brand{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><b>PRISMA ABYSS Map Editor vNext</b><small>source-preserving / world-aware</small></div>
  <span class="status"><span id="mapSourceDot" class="dot"></span><span id="mapSourceStatus">map.js source未読込</span></span>
  <span class="status"><span id="storySourceDot" class="dot"></span><span id="storySourceStatus">story.js source未読込</span></span>
  <span id="dirtyBadge" class="badge">変更なし</span>
  <div class="top-spacer"></div>
  <button class="btn ghost" id="reloadBtn">再読込</button>
  <button class="btn" id="undoBtn">戻す</button>
  <button class="btn" id="redoBtn">やり直す</button>
  <button class="btn gold" id="validateBtn">検証</button>
  <button class="btn primary" id="exportMapBtn">map.js 出力</button>
  <button class="btn green" id="exportStoryBtn">story.js 出力</button>
  <input id="mapFileInput" type="file" accept=".js,text/javascript" hidden>
  <input id="storyFileInput" type="file" accept=".js,text/javascript" hidden>
</header>
<div class="layout">
  <aside class="side">
    <div class="worktabs" id="workTabs">
      <button class="tab active" data-work="world">ワールド</button>
      <button class="tab" data-work="fixed">固定MAP</button>
      <button class="tab" data-work="dungeon">固定DUNGEON</button>
      <button class="tab" data-work="story">ストーリー</button>
      <button class="tab" data-work="data">データ</button>
    </div>
    <div class="worldtabs" id="worldTabs">
      <button class="tab active" data-world="WORLD">地上世界</button>
      <button class="tab" data-world="ABYSS_WORLD">深淵世界</button>
    </div>
    <div class="search"><input id="searchInput" placeholder="名称 / ID / MAP ID で検索"></div>
    <div class="list" id="entryList"></div>
    <div class="side-foot" id="sideInfo">標準は軽量カラー描画です。画像表示は必要時だけONにしてください。</div>
  </aside>
  <main class="center">
    <div class="canvasbar">
      <span class="title" id="canvasTitle">地上世界</span>
      <label id="canvasFloorWrap" class="hidden">階 <select id="canvasFloorSelect"></select></label>
      <button class="btn small" id="fitBtn">全体</button>
      <button class="btn small" id="centerBtn">選択へ</button>
      <label>Zoom <input id="zoomRange" type="range" min="6" max="40" value="12"></label>
      <label><input id="imageMode" type="checkbox"> 画像</label>
      <label><input id="gridMode" type="checkbox" checked> Grid</label>
      <label><input id="markerMode" type="checkbox" checked> 拠点</label>
      <span class="badge" id="sizeBadge">-</span>
    </div>
    <div class="canvaswrap" id="canvasWrap"><div class="stage"><canvas id="mapCanvas"></canvas><div class="coord" id="coordBox">x:- y:-</div></div></div>
    <div class="palette">
      <div class="palette-head"><b id="paletteTitle">タイル</b><span class="hint" id="paletteHint">クリック/ドラッグで塗ります。</span></div>
      <div class="tilegrid" id="tileGrid"></div>
    </div>
  </main>
  <aside class="right">
    <div class="right-head">
      <button class="tab active" data-inspector="edit">編集</button>
      <button class="tab" data-inspector="objects">オブジェクト</button>
      <button class="tab" data-inspector="raw">詳細JSON</button>
      <button class="tab" data-inspector="check">検証</button>
    </div>
    <div class="right-body" id="inspector"></div>
  </aside>
</div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
const state={work:'world',world:'WORLD',selected:null,selectedFloor:0,selectedObjectType:'chests',selectedObjectIndex:-1,search:'',zoom:12,imageMode:false,gridMode:true,markerMode:true,paintTile:'G',inspector:'edit',drag:false,lastCell:null,strokeSnapshot:false,dirty:new Set(),history:[],future:[],validation:[],sources:{map:'',story:''},sourceOk:{map:false,story:false},data:{}};
const EDITABLE_CONSTS=new Set(['STORY_MAP_MUTATIONS','TILE_THEMES','DUNGEON_WALL_FACE_THEMES','MAP_FLOOR_DECOR_THEMES','STORY_DATA','SEA_ENCOUNTER_MONSTERS','FIELD_ENCOUNTER_ZONES','WORLD_BRIDGES','SURFACE_WORLD_MAP_DATA','ABYSS_WORLD_MAP_DATA','FIXED_TILE_OVERLAYS','FIXED_OVERLAY_BASE_TILES','FIXED_MAPS','FIXED_DUNGEON_MAPS','AUTHORED_MAP_PROP_PLACEMENTS']);
const PROTECTED_CONSTS=['MAP_MASTER','RETIRED_MAP_IDS','MAP_ID_ALIASES','MAP_IDS','FIXED_AREA_MAP_KEYS','FIXED_AREA_MAP_SECTION_INDEX','STORY_AREA_MAP_KEYS','WORLD_MAPS','DERIVED_PROGRESS_FLAGS','ABYSS_REGION_MASTER'];
const WORLD_NAMES={WORLD:'地上世界',ABYSS_WORLD:'深淵世界'};
const TILE_FALLBACK={W:'#155d7a',M:'#66636a',F:'#1f6a3f',L:'#6c6847',G:'#2c7a4e',T:'#42604d',I:'#d7b45a',B:'#db3b4d',D:'#303541',K:'#7e3fa1',E:'#f6ca62',H:'#766b58',R:'#a84c66',V:'#775888','~':'#155d7a','^':'#6098cf',S:'#d7b45a',C:'#9c6332',U:'#c9a65c',P:'#8f7dff'};
const OBJECT_COLORS={chests:'#e2a452',bosses:'#ff4d67',floorLinks:'#64d7ff',mapActors:'#7df0ad',mapActions:'#b68cff',tileEffects:'#63c6ff',healSprings:'#62e4ff',blockingObjects:'#e2dbb4',floorDecorations:'#c9a778'};
let renderPending=false,searchTimer=null;
function runtime(name,fallback){try{return typeof window[name]!=='undefined'?window[name]:fallback}catch{return fallback}}
function initData(){
 state.data={
  storyMapMutations:clone(runtime('STORY_MAP_MUTATIONS',{})),tileThemes:clone(runtime('TILE_THEMES',{})),dungeonWallFaceThemes:clone(runtime('DUNGEON_WALL_FACE_THEMES',{})),mapFloorDecorThemes:clone(runtime('MAP_FLOOR_DECOR_THEMES',{})),storyData:clone(runtime('STORY_DATA',{})),seaEncounterMonsters:clone(runtime('SEA_ENCOUNTER_MONSTERS',[])),fieldEncounterZones:clone(runtime('FIELD_ENCOUNTER_ZONES',[])),worldBridges:clone(runtime('WORLD_BRIDGES',[])),surfaceWorld:clone(runtime('SURFACE_WORLD_MAP_DATA',[])),abyssWorld:clone(runtime('ABYSS_WORLD_MAP_DATA',[])),fixedTileOverlays:clone(runtime('FIXED_TILE_OVERLAYS',{})),fixedOverlayBaseTiles:clone(runtime('FIXED_OVERLAY_BASE_TILES',{})),fixedMaps:clone(runtime('FIXED_MAPS',{})),fixedDungeons:clone(runtime('FIXED_DUNGEON_MAPS',{})),authoredProps:clone(runtime('AUTHORED_MAP_PROP_PLACEMENTS',[])),mapMaster:clone(runtime('MAP_MASTER',{})),storyManager:clone(runtime('STORY_MANAGER_DATA',{}))
 };
 stripDerivedAll(); state.dirty.clear(); state.history=[];state.future=[];
}
function stripDerivedMap(obj){if(!obj||typeof obj!=='object')return obj;['mapId','canonicalMapKey','mapSection','sectionId','floorId','areaKey','regionKey','mapKind'].forEach(k=>delete obj[k]);return obj}
function stripDerivedDungeon(obj){if(!obj||typeof obj!=='object')return obj;['mapId','floorId','areaKey','regionKey','mapKind'].forEach(k=>delete obj[k]);(obj.floors||[]).forEach(f=>['mapId','floorId','areaKey','regionKey','mapKind'].forEach(k=>delete f[k]));return obj}
function stripDerivedAll(){Object.values(state.data.storyData?.areas||{}).forEach(a=>delete a.mapId);Object.values(state.data.fixedMaps||{}).forEach(stripDerivedMap);Object.values(state.data.fixedDungeons||{}).forEach(stripDerivedDungeon)}
async function loadSources(){
 const results=await Promise.allSettled([fetchText('map.js'),fetchText('story.js')]);
 if(results[0].status==='fulfilled'){state.sources.map=results[0].value;state.sourceOk.map=true}else state.sourceOk.map=false;
 if(results[1].status==='fulfilled'){state.sources.story=results[1].value;state.sourceOk.story=true}else state.sourceOk.story=false;
 updateSourceStatus();
}
async function fetchText(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url);return await r.text()}
function updateSourceStatus(){
 $('#mapSourceDot').className='dot '+(state.sourceOk.map?'ok':'warn');$('#mapSourceStatus').textContent=state.sourceOk.map?'map.js source保持':'map.jsを選択してください';
 $('#storySourceDot').className='dot '+(state.sourceOk.story?'ok':'warn');$('#storySourceStatus').textContent=state.sourceOk.story?'story.js source保持':'story.jsを選択してください';
 $('#dirtyBadge').textContent=state.dirty.size?`変更 ${state.dirty.size}`:'変更なし';$('#dirtyBadge').className='badge '+(state.dirty.size?'warn':'');
}
function worldTiles(){return state.world==='ABYSS_WORLD'?state.data.abyssWorld:state.data.surfaceWorld}
function areaWorld(a){return a?.worldKey==='ABYSS_WORLD'?'ABYSS_WORLD':'WORLD'}
function fixedWorld(m,key){const storyWorld=state.data.storyData?.areas?.[key]?.worldKey;return (m?.worldKey==='ABYSS_WORLD'||storyWorld==='ABYSS_WORLD')?'ABYSS_WORLD':'WORLD'}
function entriesForCurrent(){const q=state.search.toLowerCase();let out=[];
 if(state.work==='world'){out=Object.entries(state.data.storyData?.areas||{}).filter(([,a])=>areaWorld(a)===state.world&&Number.isFinite(Number(a.centerX))&&Number.isFinite(Number(a.centerY))).map(([key,a])=>({key,name:a.name||key,sub:`${key}  (${a.centerX},${a.centerY})`,kind:'area'}));}
 else if(state.work==='fixed'){out=Object.entries(state.data.fixedMaps||{}).filter(([key,m])=>fixedWorld(m,key)===state.world).map(([key,m])=>({key,name:m.name||key,sub:`${key}  ${m.width||'?'}×${m.height||'?'}`,kind:'fixed'}));}
 else if(state.work==='dungeon'){out=Object.entries(state.data.fixedDungeons||{}).filter(([key,m])=>fixedWorld(m,key)===state.world).map(([key,m])=>({key,name:m.name||key,sub:`${key}  ${(m.floors||[]).length}階`,kind:'dungeon'}));}
 else if(state.work==='story'){out=[...Object.keys(state.data.storyManager?.scripts||{}).map(key=>({key,name:key,sub:'会話スクリプト',kind:'script'})),...Object.keys(state.data.storyManager?.events||{}).map(key=>({key,name:key,sub:'イベント',kind:'event'}))];}
 else {out=[{key:'FIELD_ENCOUNTER_ZONES',name:'フィールド遭遇帯',sub:`${state.data.fieldEncounterZones.length}件`,kind:'data'},{key:'WORLD_BRIDGES',name:'橋',sub:`${state.data.worldBridges.length}件`,kind:'data'},{key:'STORY_MAP_MUTATIONS',name:'MAP変化',sub:`${Object.keys(state.data.storyMapMutations).length}件`,kind:'data'},{key:'AUTHORED_MAP_PROP_PLACEMENTS',name:'手動装飾台帳',sub:`${state.data.authoredProps.length}件`,kind:'data'}];}
 if(q)out=out.filter(e=>(e.name+' '+e.key+' '+e.sub).toLowerCase().includes(q));return out}
function renderList(){const list=$('#entryList'),ents=entriesForCurrent();list.innerHTML='';const frag=document.createDocumentFragment();for(const e of ents){const b=document.createElement('button');b.className='entry'+(state.selected?.kind===e.kind&&state.selected?.key===e.key?' active':'');b.innerHTML=`<b>${esc(e.name)}</b><small>${esc(e.sub)}</small>`;b.onclick=()=>selectEntry(e);frag.appendChild(b)}list.appendChild(frag);$('#sideInfo').textContent=`${WORLD_NAMES[state.world]} / ${ents.length}件表示。固定MAPとDUNGEONはワールド拠点表示へ混ぜません。`}
function selectEntry(e){state.selected=e;state.selectedFloor=0;state.selectedObjectIndex=-1;renderList();scheduleRender();renderInspector();if(e.kind==='area')centerOn(Number(state.data.storyData.areas[e.key].centerX),Number(state.data.storyData.areas[e.key].centerY))}
function scheduleRender(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;renderCanvas();renderPalette();updateCanvasTitle()})}
function updateCanvasTitle(){let t=WORLD_NAMES[state.world];if(state.selected){if(state.selected.kind==='fixed')t=state.data.fixedMaps[state.selected.key]?.name||state.selected.key;else if(state.selected.kind==='dungeon'){const d=state.data.fixedDungeons[state.selected.key];const f=d?.floors?.[state.selectedFloor];t=`${d?.name||state.selected.key} / ${f?.label||`${state.selectedFloor+1}階`}`;}else if(state.selected.kind==='area')t=`${WORLD_NAMES[state.world]} / ${state.data.storyData.areas[state.selected.key]?.name||state.selected.key}`;}$('#canvasTitle').textContent=t;updateCanvasFloorSelect()}
function updateCanvasFloorSelect(){const wrap=$('#canvasFloorWrap'),sel=$('#canvasFloorSelect');if(!wrap||!sel)return;const d=state.work==='dungeon'&&state.selected?.kind==='dungeon'?state.data.fixedDungeons[state.selected.key]:null;const floors=d?.floors||[];if(!floors.length){wrap.classList.add('hidden');sel.innerHTML='';return}const max=Math.max(0,floors.length-1);if(state.selectedFloor>max)state.selectedFloor=max;const html=floors.map((f,i)=>`<option value="${i}">${esc(f.label||`${i+1}階`)}</option>`).join('');if(sel.innerHTML!==html)sel.innerHTML=html;sel.value=String(state.selectedFloor);wrap.classList.remove('hidden')}
function currentMapDef(){if(state.work==='fixed'&&state.selected?.kind==='fixed')return state.data.fixedMaps[state.selected.key];if(state.work==='dungeon'&&state.selected?.kind==='dungeon')return state.data.fixedDungeons[state.selected.key]?.floors?.[state.selectedFloor]||null;return null}
function currentTiles(){if(state.work==='world')return worldTiles();const m=currentMapDef();return Array.isArray(m?.tiles)?m.tiles:[]}
function themeForCurrent(){if(state.work==='world'){const world=runtime('WORLD_MAPS',{})?.[state.world]||{};return {...(state.data.tileThemes?.WORLD||{}),...(world.tileOverrides||{})};}if(state.work==='fixed'){const m=currentMapDef();return {...(state.data.tileThemes?.DEFAULT||{}),...(state.data.tileThemes?.[m?.themeKey]||{})};}if(state.work==='dungeon'){const d=state.data.fixedDungeons[state.selected?.key]||{};const f=currentMapDef();return {...(state.data.tileThemes?.DEFAULT||{}),...(state.data.tileThemes?.[f?.themeKey||d.themeKey]||{})};}return state.data.tileThemes?.DEFAULT||{}}
function renderCanvas(){const c=$('#mapCanvas'),ctx=c.getContext('2d'),rows=currentTiles();if(!rows.length){c.width=720;c.height=420;ctx.fillStyle='#08111f';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#8293ad';ctx.font='14px sans-serif';ctx.fillText('左の一覧からマップを選択してください',24,36);$('#sizeBadge').textContent='-';return}
 const h=rows.length,w=Math.max(...rows.map(r=>String(r).length)),z=state.zoom;c.width=w*z;c.height=h*z;$('#sizeBadge').textContent=`${w}×${h}`;ctx.imageSmoothingEnabled=false;const theme=themeForCurrent();

function generateStorySource(){if(!state.sourceOk.story)throw new Error('現在の story.js ソースを読み込んでください');if(!state.dirty.has('STORY_MANAGER_DATA'))return state.sources.story;return replaceConst(state.sources.story,'STORY_MANAGER_DATA',jsLiteral(state.data.storyManager))}
